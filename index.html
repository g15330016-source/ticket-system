<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>雲端彩票監控系統 - 缺票回報</title>
  <style>
    * { box-sizing: border-box; font-family: 'Helvetica Neue', Arial, sans-serif; }
    body {
      background-color: #f4f6f9;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      min-height: 100vh; margin: 0; padding: 20px;
    }
    .card {
      background: #ffffff; padding: 30px; border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08); text-align: center;
      max-width: 400px; width: 100%;
    }
    h2 { color: #333; margin-bottom: 8px; }
    p { color: #666; font-size: 14px; margin-bottom: 24px; }
    .machine-badge {
      display: inline-block; background-color: #eef2ff; color: #4f46e5;
      font-weight: bold; padding: 8px 16px; border-radius: 20px;
      font-size: 18px; margin-bottom: 20px;
    }
    button {
      background-color: #ef4444; color: white; border: none;
      padding: 14px 28px; font-size: 16px; font-weight: bold;
      border-radius: 8px; cursor: pointer; width: 100%;
      transition: background-color 0.2s;
    }
    button:hover { background-color: #dc2626; }
    button:disabled { background-color: #9ca3af; cursor: not-allowed; }
    #status-msg { margin-top: 16px; font-weight: bold; font-size: 14px; }
    .success { color: #16a34a; }
    .error { color: #dc2626; }
  </style>
</head>
<body>

  <div class="card">
    <h2>彩票缺票回報</h2>
    <p>若發現本機台彩票已售罄，請點擊下方按鈕通知工作人員前來補充。</p>
    
    <div class="machine-badge" id="display-machine-id">機台編號：載入中...</div>
    
    <button id="report-btn" onclick="submitReport()">回報此機台缺票</button>
    <div id="status-msg"></div>
  </div>

  <script>
    // 1. 貼上剛才從 Apps Script 複製的網址
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzU0hlXRhBGKQQe1SA2GM4vt5OSSG5bLQyrPwneMSAFPwm1w_wLHztvJ2HBKnFF_wtD9A/exec";

    // 2. 從網址參數獲取機台編號 (例如：index.html?machine=A01)
    const urlParams = new URLSearchParams(window.location.search);
    const machineId = urlParams.get('machine') || '未知機台';

    document.getElementById('display-machine-id').innerText = `機台編號：${machineId}`;

    function submitReport() {
      if (machineId === '未知機台') {
        alert('無效的機台編號，無法進行回報！');
        return;
      }

      const btn = document.getElementById('report-btn');
      const msg = document.getElementById('status-msg');
      
      btn.disabled = true;
      btn.innerText = "傳送中...";
      msg.innerText = "";

      // 發送 POST 請求給 Apps Script
      fetch(GAS_WEB_APP_URL, {
        method: "POST",
        mode: "no-cors", // Google Apps Script 跨網域常規設定
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ machineId: machineId })
      })
      .then(() => {
        msg.className = "success";
        msg.innerText = "已成功通知工作人員！感謝您的回報。";
        btn.innerText = "回報完成";
      })
      .catch(error => {
        msg.className = "error";
        msg.innerText = "回報失敗，請稍後再試。";
        btn.disabled = false;
        btn.innerText = "回報此機台缺票";
        console.error(error);
      });
    }
  </script>

</body>
</html>
